<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja Rápida - Salvador Gym</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <h1 class="logo-text">SALVADOR <span class="neon-text">GYM</span></h1>
            <button class="nav-btn active" onclick="location.href='index.html'">🛒 Caja Rápida</button>
            <button class="nav-btn" onclick="location.href='socios.html'">👥 Socios</button>
            <button class="nav-btn" onclick="location.href='membresias.html'">🎟️ Membresías</button>
            <button class="nav-btn" onclick="location.href='inventario.html'">📦 Inventario</button>
            <button class="nav-btn" onclick="location.href='finanzas.html'">💰 Finanzas Hoy</button>
            <button class="nav-btn" onclick="location.href='caja_global.html'">📊 Caja Global</button>
            <button class="nav-btn" onclick="location.href='configuracion.html'">⚙️ Configuración</button>
            <button class="floating-wsp-btn" onclick="abrirGrupoWsp()">💬 Grupo WhatsApp</button>
        </div>

        <div class="main-panel">
            <h2>🛒 Venta Rápida</h2>
            <div id="grid-productos" class="product-grid"></div>
        </div>

        <div class="ticket-panel">
            <h2 style="color: #00E5FF; border-bottom: 1px solid #333; padding-bottom: 10px;">Ticket Actual</h2>
            <div class="ticket-items"></div>
            
            <div class="total-section">
                <h3 id="texto-total">Total: S/ 0.00</h3>
            </div>

            <button class="pay-btn yape-btn" id="btn-yape">📱 Pago con Yape</button>
            <button class="pay-btn cash-btn" id="btn-efectivo">💵 Pago en Efectivo</button>
            <button class="pay-btn fiado-btn" id="btn-fiado" style="background-color: #FF9800; color: #000; margin-top: 10px;">📝 Dejar Fiado</button>
            <button id="btn-abrir-cobrar-deuda" class="pay-btn" style="background-color: #ff4444; color: #fff; margin-top: 10px;">💰 Cobrar Deuda a Socio</button>
        </div>
    </div>

    <div id="modal-fiado" class="modal-overlay" style="z-index: 9999;">
        <div class="modal-content">
            <h3 style="color: #FF9800; border-bottom: 1px solid #333; padding-bottom: 10px;">Registrar Fiado</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Selecciona el socio de confianza:</label>
                <select id="select-socio-fiado" class="form-control" style="cursor: pointer;"></select>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-cerrar-fiado" class="btn-cancel">Cancelar</button>
                <button type="button" id="btn-confirmar-fiado" class="pay-btn" style="background-color: #FF9800; color: #000; margin: 0; width: auto; padding: 10px 20px;">Confirmar Fiado</button>
            </div>
        </div>
    </div>
    
    <div id="modal-cobrar-deuda" class="modal-overlay" style="z-index: 9999;">
        <div class="modal-content" style="width: 450px;">
            <h3 style="color: #ff4444; border-bottom: 1px solid #333; padding-bottom: 10px;">Cobrar Deuda Pendiente</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Selecciona la deuda a cancelar:</label>
                <select id="select-deuda-cobrar" class="form-control" style="cursor: pointer;"></select>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Método de Pago con el que está cancelando:</label>
                <select id="select-metodo-cobro-deuda" class="form-control" style="cursor: pointer;">
                    <option value="Efectivo">💵 Efectivo</option>
                    <option value="Yape">📱 Yape</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-cerrar-cobrar-deuda" class="btn-cancel">Cancelar</button>
                <button type="button" id="btn-confirmar-cobro-deuda" class="pay-btn" style="background-color: #00E5FF; color: #000; margin: 0; width: auto; padding: 10px 20px;">✅ Cobrar y Registrar</button>
            </div>
        </div>
    </div>

    <script src="../js/alertas.js"></script>
    <script src="../js/app.js"></script>
    <script>
        function abrirGrupoWsp() {
            require('electron').shell.openExternal('https://web.whatsapp.com/');
        }
    </script>
</body>
</html>
